name: Worker (processa a fila de tarefas)
on:
  schedule:
    - cron: "*/5 * * * *"   # sem custo; o GitHub pode atrasar alguns minutos
  workflow_dispatch:
permissions:
  contents: read
concurrency: {group: worker, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: https://xmflykobjxjtulgqttob.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      WORKER_MAX_SECONDS: "6000"
    steps:
      - name: Verificar segredos
        id: chk
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "::notice::SUPABASE_SERVICE_KEY nao configurado; nada a fazer."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.ok == 'true'
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-worker.txt}
      - name: Dependencias de audio (Kokoro)
        if: steps.chk.outputs.ok == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg fonts-dejavu-core >/dev/null
          pip install -q -r backend/requirements-worker.txt
      - uses: actions/cache@v4
        if: steps.chk.outputs.ok == 'true'
        with: {path: backend/.kokoro, key: kokoro-model-v1}
      - name: Executar worker
        if: steps.chk.outputs.ok == 'true'
        working-directory: backend
        env: {KOKORO_DIR: .kokoro, OUTPUT_DIR: out}
        run: python -m app.workers.runner
      - name: Publicar videos prontos (artifact, 7 dias)
        if: always() && steps.chk.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: backend/out/*.mp4
          retention-days: 7
          if-no-files-found: ignore
